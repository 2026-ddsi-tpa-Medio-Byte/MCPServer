# ── Servidor MCP ──────────────────────────────────────────────────────────────
spring.ai.mcp.server.name=donatrack
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.stdio=true

# El protocolo MCP viaja por la salida estándar: cualquier otra cosa que se escriba
# ahí la corrompe y Claude Desktop no puede conectarse. Por eso no hay banner, no
# levanta servidor web, y los logs van a un archivo en vez de a la consola.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.file.name=donatrack-mcp.log
logging.pattern.console=

# ── Módulos de DonaTrack ──────────────────────────────────────────────────────
donatrack.donaciones-url=${DONACIONES_URL:https://donatrack-donaciones.onrender.com}
donatrack.donadores-url=${DONADORES_URL:https://donadoresyentidadesv2.onrender.com}
donatrack.logistica-url=${LOGISTICA_URL:https://logistica-i4rf.onrender.com}
donatrack.incentivos-url=${INCENTIVOS_URL:https://incentivos-wtbd.onrender.com}
donatrack.deposito-default=${DEPOSITO_DEFAULT:DEP-UTN-01}

# ── API Gateway (Entrega 6) ───────────────────────────────────────────────────
# Si tiene valor, TODOS los pedidos van por el gateway y las URLs directas de arriba no se usan.
# Vacía, el MCP llama a cada módulo directamente: sirve mientras el gateway no exista.
donatrack.gateway-url=${DONATRACK_GATEWAY_URL:}

# Lo que el gateway le agrega a cada ruta y quita antes de reenviar: {gw}/logistica/api/depositos
# llega a Logística como /api/depositos. Hace falta porque Donadores e Incentivos comparten rutas
# (/donadores/...) y el gateway no podría distinguirlas solo por el path.
donatrack.prefijo-donaciones=${DONATRACK_PREFIJO_DONACIONES:/donaciones}
donatrack.prefijo-donadores=${DONATRACK_PREFIJO_DONADORES:/donadores}
donatrack.prefijo-logistica=${DONATRACK_PREFIJO_LOGISTICA:/logistica}
donatrack.prefijo-incentivos=${DONATRACK_PREFIJO_INCENTIVOS:/incentivos}
donatrack.prefijo-consultas=${DONATRACK_PREFIJO_CONSULTAS:/consultas}
